## PostgreSQL
# Runtime values are supplied through environment variables.
# See .env.example for a local-development template.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/operatorsJSON_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

server.port=${PORT:8686}
server.error.whitelabel.enabled=false
